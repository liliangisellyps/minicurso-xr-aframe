<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('girar', {
        schema: {
          velocidade: { default: 45 }
        },
        tick: function (t, dt) {
          var rad = THREE.MathUtils.degToRad(this.data.velocidade);
          this.el.object3D.rotation.y += rad * dt / 1000;
        }
      });
    </script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" color="#4CC3D9" girar></a-box>
      <a-box position="1 0.75 -3" height="1.5" color="#FFC65D" girar="velocidade: 180"></a-box>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
