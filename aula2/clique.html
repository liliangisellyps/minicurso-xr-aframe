<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script>
      AFRAME.registerComponent('trocar-cor', {
        schema: {
          cores: { type: 'array', default: ['#4CC3D9', '#EF2D5E', '#FFC65D', '#7BC8A4'] }
        },
        init: function () {
          var el = this.el;
          var cores = this.data.cores;
          var i = 0;
          el.addEventListener('click', function () {
            i = (i + 1) % cores.length;
            el.setAttribute('color', cores[i]);
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clicavel">
      <a-box class="clicavel" position="-1 0.5 -3" color="#4CC3D9" trocar-cor></a-box>
      <a-sphere class="clicavel" position="1 1 -3" radius="0.5" color="#EF2D5E" trocar-cor></a-sphere>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
