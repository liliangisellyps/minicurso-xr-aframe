<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <script>
      AFRAME.registerComponent('girar', {
        schema: {
          velocidade: { default: 45 }
        },
        tick: function (t, dt) {
          var rad = THREE.MathUtils.degToRad(this.data.velocidade);
          this.el.object3D.rotation.y += rad * dt / 1000;
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      <a-assets>
        <a-asset-item id="pato"
          src="https://raw.githubusercontent.com/KhronosGroupArchives/glTF-Sample-Models/main/2.0/Duck/glTF-Binary/Duck.glb">
        </a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <a-entity gltf-model="#pato" scale="0.3 0.3 0.3" girar="velocidade: 90"></a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
